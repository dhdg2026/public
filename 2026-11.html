<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年11月公告事項</title>
    <style>
        :root { var(--primary-color): #2c3e50; --bg-color: #f4f6f9; --text-color: #333; --border-radius: 12px; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        .container { width: 100%; max-width: 800px; margin: 2.5rem auto; padding: 0 1.25rem; }
        .back-btn { display: inline-flex; align-items: center; margin-bottom: 1.5rem; color: #3498db; text-decoration: none; font-weight: bold; font-size: 1rem; }
        .month-header { color: #2c3e50; border-bottom: 3px solid #2c3e50; padding-bottom: 0.5rem; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .notice-list { background: white; border-radius: var(--border-radius); box-shadow: 0 4px 6px rgba(0,0,0,0.02); padding: 0; margin: 0; list-style: none; overflow: hidden; }
        .notice-item { border-bottom: 1px solid #edf2f7; transition: background-color 0.2s; }
        .notice-item:last-child { border-bottom: none; }
        .notice-item:hover { background-color: #fdfdfd; }
        .notice-link { display: flex; align-items: center; padding: 1.25rem 1.5rem; text-decoration: none; color: #333; }
        .date { font-family: monospace; color: #718096; font-size: 1rem; width: 110px; flex-shrink: 0; }
        .title { font-weight: bold; color: #2c3e50; font-size: 1.1rem; flex-grow: 1; padding-right: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .arrow { color: #cbd5e0; font-size: 1.1rem; transition: transform 0.2s; }
        .notice-link:hover .arrow { transform: translateX(4px); color: #2c3e50; }
        @media (max-width: 600px) {
            .container { margin: 1.5rem auto; padding: 0 0.75rem; }
            .notice-link { flex-direction: column; align-items: flex-start; padding: 1rem 1.25rem; position: relative; }
            .date { font-size: 0.85rem; margin-bottom: 0.35rem; width: auto; }
            .title { font-size: 1rem; white-space: normal; padding-right: 1.5rem; line-height: 1.4; }
            .arrow { position: absolute; right: 1.25rem; top: 50%; transform: translateY(-50%); }
            .notice-link:hover .arrow { transform: translate(0, -50%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 返回按鈕 -->
        <a href="index.html" class="back-btn">❮ 返回年度主頁</a>

        <h1 class="month-header">2026 年 11 月 事項列表</h1>

        <ul class="notice-list">
            <!-- 📌 11月事項一 -->
            <li class="notice-item">
                <a href="post001.html" class="notice-link">
                    <span class="date">2026/11/09</span>
                    <span class="title">11月份管委會定期會議開會通知</span>
                    <span class="arrow">❯</span>
                </a>
            </li>
            
            <!-- 📌 如果11月有第二個事項，依此類推複製在下方... -->
        </ul>
    </div>

</body>
</html>
